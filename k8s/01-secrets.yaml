apiVersion: v1
kind: Secret
metadata:
  name: iapteca-secrets
  labels:
    app: iapteca
type: Opaque
stringData:
  # Root credentials for MongoDB
  mongodb-root-username: admin
  mongodb-root-password: adminpassword_secure123
  
  # Connection DSNs for each service
  # product-catalog has read-only access (catalog_user)
  product-catalog-dsn: mongodb://catalog_user:catalog_password_secure@mongodb-0.mongodb-service:27017/iapteca?replicaSet=rs0&authSource=iapteca
  
  # order-processing has read-write access (order_user)
  order-processing-dsn: mongodb://order_user:order_password_secure@mongodb-0.mongodb-service:27017/iapteca?replicaSet=rs0&authSource=iapteca
